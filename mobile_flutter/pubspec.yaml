name: secure360_mobile
description: Secure360 / Infipre Security mobile client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  http_parser: ^4.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/
